<!doctype html><meta charset="utf-8"><title>safari check</title>
<script type="module">
import { getDevice, createTrainer } from '../src/engine/trainer.js';
import { trainLoop } from '../src/engine/run.js';
import { layoutOf } from '../src/engine/layout.js';
const report = (o) => fetch('/report', { method: 'POST', body: JSON.stringify(o) });
try {
  const { adapter, device } = await getDevice();
  const errors = [];
  device.addEventListener('uncapturederror', (e) => errors.push(e.error.message));
  const small = await (await fetch('../configs/parity-small.json')).json();
  const t = await createTrainer(device, small);
  t.reset(t.c.seed);
  const enc = device.createCommandEncoder();
  const pass = enc.beginComputePass();
  t.train.encode(pass, t.opsFor(['data', 'fwd', 'loss', 'bwd', 'tick']));
  pass.end();
  device.queue.submit([enc.finish()]);
  const g = new Float32Array(await t.readback(t.G));
  const ref = new Float32Array(await (await fetch('../scratch/parity/small/grad0.bin')).arrayBuffer());
  let worst = 0; let worstName = '';
  for (const s of layoutOf(small).specs) {
    let num = 0; let den = 0;
    for (let i = s.off; i < s.off + s.size; i++) { num += (g[i] - ref[i]) ** 2; den += ref[i] ** 2; }
    const rel = Math.sqrt(num / (den || 1));
    if (rel > worst) { worst = rel; worstName = s.name; }
  }
  t.destroy();
  const tab = await (await fetch('../configs/tab.json')).json();
  const runs = [];
  for (const seed of [1, 2, 3]) {
    const tr = await createTrainer(device, { ...tab, seed });
    tr.reset(seed);
    const res = await trainLoop(device, tr, { budget: 2500, chunkSteps: () => 25, shouldStop: (s) => s.tEvent !== null });
    runs.push({ seed, tEvent: res.tEvent, tPrev: res.tPrev, wallEvent: res.wallEvent, msPerStep: res.wallMs / res.steps });
    tr.destroy();
  }
  const i = adapter.info ?? {};
  await report({ ok: true, ua: navigator.userAgent, adapter: `${i.vendor} ${i.architecture}`, gradWorst: worst, gradWorstName: worstName, runs, errors });
} catch (e) {
  await report({ ok: false, ua: navigator.userAgent, error: String(e), hasGpu: !!navigator.gpu });
}
</script>
